<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie list</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Movies</h1>
        <span class="badge bg-secondary fs-6" th:text="${moviescount} + ' films'">0 films</span>
    </div>

    <div class="card shadow-sm mb-4">
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="movie : ${movies}" th:text="${movie}">
                Movie
            </li>
            <li class="list-group-item text-muted fst-italic"
                th:if="${#lists.isEmpty(movies)}">
                No movies added.
            </li>
        </ul>
    </div>

    <a href="/form" class="btn btn-primary">+ Add movie</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
