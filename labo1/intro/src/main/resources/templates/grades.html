<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <title>Grade List</title>
</head>

<body class="bg-body-tertiary">
    <div class="container mt-5">
        <h1 class="text-center h1">Grade List</h1>

        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Grade</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="grade : ${grades}">
                    <td th:text="${grade.firstName}"></td>
                    <td th:text="${grade.lastName}"></td>
                    <td th:text="${grade.grade}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/grade/{firstName}/{lastName}(firstName=${grade.firstName}, lastName=${grade.lastName})}">
                            Detail
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="mt-3">
            <a class="btn btn-primary" th:href="@{/grade}">Grade a student</a>
        </div>
    </div>
</body>
</html>
