<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <title>Grade detail</title>
</head>

<body class="bg-body-tertiary">
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3" th:text="${grade?.firstName + ' ' + grade?.lastName + ' : ' + grade?.grade}">
                    Grade detail
                </h1>
            </div>
        </div>

        <div class="mt-3">
            <a class="btn btn-outline-secondary ms-2" th:href="@{/grades}">List all students</a>
        </div>
    </div>
</body>

</html>
