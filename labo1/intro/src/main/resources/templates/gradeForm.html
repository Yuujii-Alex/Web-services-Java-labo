<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap 5 -->
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

	<!-- jouw JS (context-path veilig) -->
	<script defer th:src="@{/js/app.js}"></script>

	<title>Grade a student</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">
	<div class="card shadow-sm">
		<div class="card-body">
			<h1 class="h3 mb-4">Grade a student</h1>

			<form th:action="@{/grade}" method="post" class="row g-3">
				<div class="col-12 col-md-4">
					<label for="firstName" class="form-label">First Name</label>
					<input type="text" class="form-control" name="firstName" id="firstName" required>
				</div>

				<div class="col-12 col-md-4">
					<label for="lastName" class="form-label">Last Name</label>
					<input type="text" class="form-control" name="lastName" id="lastName" required>
				</div>

				<div class="col-12 col-md-4">
					<label for="grade" class="form-label">Grade</label>
					<input type="text" class="form-control" name="grade" id="grade" required>
				</div>

				<div class="col-12">
					<button type="submit" class="btn btn-primary">Save</button>
					<a class="btn btn-outline-secondary ms-2" th:href="@{/list}">List all students</a>
				</div>
			</form>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
