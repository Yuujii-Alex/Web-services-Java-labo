<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <title>List of infractions</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3 mb-4">Results</h1>

            <table class="table table-striped table-hover align-middle">
                <thead>
                <tr>
                    <th>Street</th>
                    <th>Speed limit</th>
                    <th>Infractions</th>
                    <th class="text-end"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="infraction : ${infractions}">
                    <td th:text="${infraction.street}"></td>
                    <td th:text="${infraction.speedLimit}"></td>
                    <td th:text="${infraction.infractionsSpeed}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/detail/{id}(id=${infraction.id})}">
                            Open detail
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <a class="btn btn-link px-0" th:href="@{/search}">Search for infractions by year</a>
        </div>
    </div>
</div>
</body>
</html>
