<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <title>Wallet Balance</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3"
                th:text="${'The balance for ' + wallet + ' is : ' + balance}">
                Wallet Balance
            </h1>

            <div class="mt-4 d-flex flex-wrap gap-2">
                <a class="btn btn-primary" th:href="@{/transaction}">New transaction</a>
                <a class="btn btn-outline-secondary" th:href="@{/alltransactions}">All transactions</a>
                <a class="btn btn-outline-dark" th:href="@{/valid}">Test validity</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
