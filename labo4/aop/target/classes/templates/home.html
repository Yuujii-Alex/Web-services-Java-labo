<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

	<!-- <script defer th:src="@{/js/app.js}"></script> -->

	<title>Home</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">
	<div class='card shadow-sm'>
		<div class="card-body">
			<div th:if="${user != null}">
				<p th:text="${'Logged in as ' + user}"></p>
				<form th:action="@{/logout}" method="post">
					<input class="btn btn-primary" type="submit" value="Log Out"/>
				</form>
			</div>
			<div th:unless="${user != null}">
				<p>Not logged in</p>
				<a class="btn btn-primary" th:href="@{/login}">Log In</a>
			</div>
		</div>
	</div>
	<br/><br/>
	<div class="card shadow-sm">
		<div class="card-body">
			<h1 class="h3 mb-4">Home</h1>

			<div class="d-flex flex-wrap gap-2">
				<a class="btn btn-primary" th:href="@{/transaction}">New transaction</a>
				<a class="btn btn-outline-primary" th:href="@{/balance/walletA}">Balance WalletA</a>
				<a class="btn btn-outline-primary" th:href="@{/balance/walletB}">Balance WalletB</a>
				<a class="btn btn-outline-secondary" th:href="@{/alltransactions}">All transactions</a>
				<a class="btn btn-outline-dark" th:href="@{/valid}">Is BlockChain valid?</a>
				<a class="btn btn-outline-dark" th:href="@{/user}">New User</a>
			</div>
		</div>
	</div>
</div>
</body>
</html>
