<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

   <title>Log in</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">

   <div class="d-flex justify-content-end mb-3">
      <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Back to home</a>
   </div>

   <div class="card shadow-sm">
      <div class="card-body">
         <h1 class="h3 mb-4">Log in</h1>

         <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username and password.
         </div>

         <div th:if="${param.logout}" class="alert alert-info" role="alert">
            You have been logged out.
         </div>

         <form th:action="@{/login}" method="post" class="row g-3">
            <div class="col-12">
               <label for="login-username" class="form-label">Username</label>
               <input id="login-username" class="form-control" type="text" name="username" autocomplete="username" required>
            </div>

            <div class="col-12">
               <label for="login-password" class="form-label">Password</label>
               <input id="login-password" class="form-control" type="password" name="password" autocomplete="current-password" required>
            </div>

            <div class="col-12">
               <button class="btn btn-primary" type="submit">Log In</button>
            </div>
         </form>
      </div>
   </div>

</div>
</body>
</html>
