<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

   <title>New User</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">

   <div class="d-flex justify-content-end mb-3">
      <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Back to home</a>
   </div>

   <div class="card shadow-sm">
      <div class="card-body">
         <h1 class="h3 mb-4">New User</h1>

         <form th:action="@{/user}" method="post" class="row g-3">
            <div class="col-12">
               <label for="username" class="form-label">Username</label>
               <input id="username" class="form-control" type="text" name="username" autocomplete="username" required>
            </div>

            <div class="col-12">
               <label for="password" class="form-label">Password</label>
               <input id="password" class="form-control" type="password" name="password" autocomplete="new-password" required>
            </div>

            <div class="col-12">
               <label for="role" class="form-label">Role</label>
               <select id="role" class="form-select" name="role" required>
                  <option value="ADMIN">ADMIN</option>
                  <option value="USER">USER</option>
               </select>
            </div>

            <div class="col-12">
               <button class="btn btn-primary" type="submit">Create user</button>
            </div>
         </form>
      </div>
   </div>

</div>
</body>
</html>
