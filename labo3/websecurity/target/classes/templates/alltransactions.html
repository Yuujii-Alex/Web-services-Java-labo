<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>All transactions</title>
</head>

<body class="bg-body-tertiary">
<div class="container py-4">

  <div class="d-flex justify-content-end mb-3">
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Back to home</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">All transactions</h1>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/alltransactions}">Refresh</a>
      </div>

      <pre class="p-3 bg-body border rounded-3 small font-monospace"
           style="white-space: pre-wrap; overflow-wrap: anywhere; max-height: 75vh; overflow:auto;"
           th:text="${transactionsText}"></pre>
      </pre>
    </div>
  </div>

</div>
</body>
</html>
